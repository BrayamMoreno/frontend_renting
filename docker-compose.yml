version: '3.8'

services:
  # Frontend Web (Angular SPA + Nginx Production Server)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renting_frontend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
